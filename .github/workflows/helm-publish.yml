name: Publish Helm chart

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm-publish.yml"
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  # ── OCI push to ghcr.io ────────────────────────────────────────────────────
  publish-oci:
    name: Push chart to ghcr.io (OCI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        run: helm package helm/ --destination /tmp/helm-pkg

      - name: Push chart to ghcr.io
        run: |
          helm push /tmp/helm-pkg/*.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  # ── chart-releaser → GitHub Pages Helm repo ───────────────────────────────
  publish-pages:
    name: Publish chart index to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to gh-pages and create releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # chart-releaser needs full history

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure Git
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: .        # chart is at ./helm/
          config: .cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
